<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/style.css" type="text/css">
    <title>Json</title>
</head>
<body class="body">
    <section class="form-block" id="form-block">
        <form class="form">
            <label class="form_label" for="file">Send the file here:</label>
            <div class="form_input-block">
                <input class="form_input" name="file" id="file" type="file" accept=".js, .json, .txt" multiple>
                <button class="form_button" type="submit">Send a file</button>
            </div>
        </form>
    </section>
    <section class="include" id="include">

    </section>
    <script src="/static/js/script.js"></script>
</body>
</html>
